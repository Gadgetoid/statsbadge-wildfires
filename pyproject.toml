[project]
name = "statsbadge-wildfires"
dynamic = ["version"]
description = "Wildfire perimeters near a location, on a map, for statsbadge"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
requires-python = ">=3.11"
# 2.1 is where Source.location and the badge-wide place setting land: this page is set to a
# location and has nothing to draw without one.
dependencies = ["statsbadge>=2.1.0"]

[project.urls]
Homepage = "https://github.com/pimoroni/statsbadge-wildfires"
Repository = "https://github.com/pimoroni/statsbadge-wildfires"
Issues = "https://github.com/pimoroni/statsbadge-wildfires/issues"

# The whole extension mechanism is this one entry point:
[project.entry-points."statsbadge.sources"]
wildfires = "statsbadge_wildfires:Wildfires"

# The tag is the version.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/statsbadge_wildfires"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
