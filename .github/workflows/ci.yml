name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.9.2"

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no v9 tag, only exact versions
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # statsbadge's rules, minus the badge builtins: nothing linted here runs on the badge.
      - name: Lint
        run: uvx --from "ruff>=0.6" ruff check --config ci/ruff.toml src tests

      - run: uv build

      # Decimation is arithmetic against the pixels a fire is drawn at, and getting it wrong
      # is a plausible outline rather than a failure. The feeds are faked, so this reaches
      # no network.
      - name: Test
        run: |
          uv venv /tmp/tests
          uv pip install --python /tmp/tests/bin/python dist/*.whl
          /tmp/tests/bin/python tests/test_wildfires.py

      # The badge page is imported by the app, not by the host, so nothing here would catch
      # a syntax error in it. The firmware builtins it draws through are absent, so it is
      # compiled rather than imported.
      - name: Compile the badge page
        run: python -m py_compile src/statsbadge_wildfires/badge/firemap.py

      # The entry point is the whole mechanism: a typo in it is a package that installs and
      # provides nothing, and nothing says so.
      - name: Check the entry point is registered
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python --no-deps dist/*.whl
          /tmp/check/bin/python - <<'PY'
          from importlib.metadata import entry_points
          found = {e.name: e.value for e in entry_points(group="statsbadge.sources")}
          assert found.get("wildfires") == "statsbadge_wildfires:Wildfires", found
          print("entry point:", found)
          PY

      # The badge module ships inside the wheel and `statsbadge install` copies it onto the
      # badge. Left out of the build it is a page the app never draws.
      #
      # Read out of the archive rather than imported: importing the package pulls in
      # statsbadge, which the entry point check installs without.
      - name: Check the badge module ships in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          shipped = zipfile.ZipFile(wheel).namelist()
          wanted = "statsbadge_wildfires/badge/firemap.py"
          assert wanted in shipped, shipped
          print("badge module:", wanted, "in", wheel)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
